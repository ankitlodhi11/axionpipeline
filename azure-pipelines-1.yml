trigger:
- main

pool:
  name: dhurander

stages:
- stage: DockerBuild

  jobs:
  - job: BuildAndPush

    steps:

    # Check Dockerfile location
    - task: PowerShell@2
      displayName: 'Check Dockerfile Path'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "====================================="
          Write-Host "Build Sources Directory:"
          Write-Host "$(Build.SourcesDirectory)"

          Write-Host "====================================="
          Write-Host "Root folders:"
          Get-ChildItem "$(Build.SourcesDirectory)"

          Write-Host "====================================="
          Write-Host "Searching Dockerfiles:"

          Get-ChildItem "$(Build.SourcesDirectory)" -Recurse -Filter Dockerfile |
            Select-Object FullName

    # Login to Azure Container Registry
    - task: Docker@2
      displayName: 'Docker Login'
      inputs:
        containerRegistry: 'docker-rg'
        command: 'login'

    # Build and Push Image
    - task: Docker@2
      displayName: 'Build and Push'
      inputs:
        containerRegistry: 'docker-rg'
        repository: 'ankitlodhi11.axionpipeline'
        command: 'buildAndPush'
        Dockerfile: '$(Build.SourcesDirectory)/axion-ingestion-service/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)/axion-ingestion-service'
        tags: |
          $(Build.BuildId)