trigger:
- main

pool:
  name: dhurander

stages:
- stage: DockerBuild
  jobs:
  - job: BuildAndPush
    steps:

    - task: Docker@2
      displayName: Build and Push
      inputs:
        containerRegistry: 'docker-rg'
        repository: 'grugram.azurecr.io/ingestion'
        command: 'buildAndPush'
        Dockerfile: '$(Build.SourcesDirectory)/axion-ingestion-service/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)/axion-ingestion-service'
        tags: '$(Build.BuildId)'
    - task: Docker@2
      inputs:
        containerRegistry: 'docker-rg'
        repository: 'grugram.azurecr.io/telemetry'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        buildContext: 'axion-telemetry-query-service'
    - task: Docker@2
      inputs:
        containerRegistry: 'docker-rg'
        repository: 'grugram.azurecr.io/simulator'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        buildContext: 'axion-data-simulator'
    - task: Docker@2
      inputs:
        containerRegistry: 'docker-rg'
        repository: 'grugram.azurecr.io/axion-ui'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        buildContext: 'axion-ui'