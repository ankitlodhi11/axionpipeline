trigger:
- main

pool:
  name: dhurander
stages:
- stage: Build
  displayName: Build and Push to ACR
  jobs:
  - job: DockerBuild
    displayName: Build Docker Image
    steps:
    - task: Docker@2
      displayName: Build and Push Image
      inputs:
        containerRegistry: 'docker-rg'
        repository: 'telemetry'
        command: 'buildAndPush'
        Dockerfile: '$(Build.SourcesDirectory)/axion-telemetry-query-service/Dockerfile'
        tags: '$(Build.BuildId)'
- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: AKSDeploy
    displayName: Deploy to AKS
    steps:
    - task: KubernetesManifest@1
      displayName: Deploy Deployment YAML
      inputs:
        action: 'deploy'
        connectionType: 'kubernetesServiceConnection'
        kubernetesServiceConnection: 'axionaks'
        manifests: '$(Build.SourcesDirectory)/axion-telemetry-query-service/Manifests'
        containers: 'grugram.azurecr.io/telemetry:$(Build.BuildId)'