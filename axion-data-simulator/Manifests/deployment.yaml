apiVersion: apps/v1
kind: Deployment
metadata:
  name: axionsimulator  
spec:
  replicas: 1
  selector:
    matchLabels:
      app: axionsimulator
  template:
    metadata:
      labels:
        app: axionsimulator 
    spec:
      containers:
        - name: simulatorcontainer
          image: grugram.azurecr.io/simulator:IMAGE_TAG
          env:
            - name: API_URL
              value: "http://azioningestion-service:8000/api/v1/telemetry/ingest"

            - name: INTERVAL_SECONDS
              value: "5"  
          